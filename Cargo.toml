[package]
name = "offcut"
version = "0.1.0"
edition = "2024"
authors = ["Squirrelsoft"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
ignore = "0.4"
glob = "0.3"
walkdir = "2.5"
terminal_size = "0.4.4"
unicode-width = "0.2"

# Lightweight color crate, gated on TTY. Well-maintained, minimal deps.
[dependencies.owo-colors]
version = "4"
